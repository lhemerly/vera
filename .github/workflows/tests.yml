name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install z3-solver pytest

      - name: Compiler and verifier tests
        run: python -m pytest tests/test_vera.py -q

      - name: Rust runtime tests
        run: python -m pytest tests/test_rust_runtime.py -q

      - name: GPU backend tests
        run: python -m pytest tests/test_gpu_backend.py -q
        continue-on-error: true

      - name: io_uring WAL tests
        run: python -m pytest tests/test_io_uring_wal.py -q
        continue-on-error: true
