name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_GL_VERSION_OVERRIDE: "4.6"
      MESA_GLSL_VERSION_OVERRIDE: "460"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/vera-rt

      - name: Install headless shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libegl1-mesa-dev libgl-dev libgl1-mesa-dri mesa-utils

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build

      - name: Complete language and backend conformance
        run: python -m pytest tests -q -ra

      - name: Rust runtime unit tests
        run: cargo test --manifest-path rust/vera-rt/Cargo.toml --locked

      - name: Build distributable packages
        run: python -m build
