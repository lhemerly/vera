name: tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_GL_VERSION_OVERRIDE: "4.6"
      MESA_GLSL_VERSION_OVERRIDE: "460"
      VERA_REQUIRE_GPU_TESTS: "1"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl unzip glslang-tools libegl1-mesa-dev libgl-dev libgl1-mesa-dri

      - name: Install static solver
        run: |
          sh tools/setup_z3.sh
          . ./.deps/z3/env.sh
          printf '%s=%s\n' Z3_LIBRARY_PATH_OVERRIDE "$Z3_LIBRARY_PATH_OVERRIDE" >> "$GITHUB_ENV"
          printf '%s=%s\n' Z3_SYS_Z3_VERSION "$Z3_SYS_Z3_VERSION" >> "$GITHUB_ENV"

      - name: Formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Language, runtime and GPU tests
        run: cargo test --workspace --locked -- --test-threads=4

      - name: Build native package
        run: |
          sh tools/package_native.sh
          target/release/vera check examples/counter.vera
          target/release/vera verify examples/bank.vera
          env PATH="" target/release/vera verify examples/counter.vera

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: vera-linux
          path: |
            dist/vera-*.tar.gz
            dist/vera-*.sha256
          if-no-files-found: error
