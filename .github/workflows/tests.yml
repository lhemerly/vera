name: tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_GL_VERSION_OVERRIDE: "4.6"
      MESA_GLSL_VERSION_OVERRIDE: "460"
      VERA_REQUIRE_GPU_TESTS: "1"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install native test tools
        run: |
          export http_proxy="${http_proxy:-${HTTP_PROXY:-${https_proxy:-${HTTPS_PROXY:-}}}}"
          export https_proxy="${https_proxy:-${HTTPS_PROXY:-$http_proxy}}"
          if test -n "$http_proxy$https_proxy"; then
            echo 'Using the configured package-download proxy.'
          else
            echo 'No package-download proxy is configured.'
          fi
          . /etc/os-release
          vera_ubuntu_sources="$RUNNER_TEMP/vera-ubuntu.sources"
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://archive.ubuntu.com/ubuntu' \
            "Suites: $VERSION_CODENAME ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports" \
            'Components: main universe' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            '' \
            'Types: deb' \
            'URIs: https://security.ubuntu.com/ubuntu' \
            "Suites: ${VERSION_CODENAME}-security" \
            'Components: main universe' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            > "$vera_ubuntu_sources"
          vera_apt_options=(
            -o "Dir::Etc::sourcelist=$vera_ubuntu_sources"
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=60
          )
          sudo --preserve-env=http_proxy,https_proxy,NO_PROXY,no_proxy apt-get "${vera_apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo --preserve-env=http_proxy,https_proxy,NO_PROXY,no_proxy apt-get "${vera_apt_options[@]}" install -y --no-install-recommends build-essential curl unzip glslang-tools libegl-dev libgl-dev libgl1-mesa-dri

      - name: Install static solver
        run: |
          sh tools/setup_z3.sh
          . ./.deps/z3/env.sh
          printf '%s=%s\n' Z3_LIBRARY_PATH_OVERRIDE "$Z3_LIBRARY_PATH_OVERRIDE" >> "$GITHUB_ENV"
          printf '%s=%s\n' Z3_SYS_Z3_VERSION "$Z3_SYS_Z3_VERSION" >> "$GITHUB_ENV"
          printf '%s=%s\n' Z3_NO_PKG_CONFIG "$Z3_NO_PKG_CONFIG" >> "$GITHUB_ENV"

      - name: Formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Language, runtime and GPU tests
        run: cargo test --workspace --locked -- --test-threads=4

      - name: Conventional Rust shell checks
        env:
          VERA: ${{ github.workspace }}/target/debug/vera
        run: |
          cargo fmt --manifest-path examples/parcel-quote/Cargo.toml -- --check
          cargo clippy --manifest-path examples/parcel-quote/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path examples/parcel-quote/Cargo.toml --locked

      - name: Build native package
        run: |
          sh tools/package_native.sh
          target/release/vera check examples/counter.vera
          target/release/vera verify examples/bank.vera
          env PATH="" target/release/vera verify examples/counter.vera

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Contract workflow compiler integration
        env:
          VERA_CONTRACT_BINARY: ${{ github.workspace }}/target/release/vera
        run: node --test integrations/dsh-contract-workflow/test/backend.test.js

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: vera-linux
          path: |
            dist/vera-*.tar.gz
            dist/vera-*.sha256
          if-no-files-found: error
