[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-lang"
version = "1.1.0"
description = "VERA Python reference oracle for development and conformance tests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["z3-solver>=4.12"]

[project.optional-dependencies]
test = ["pytest>=8", "wgpu>=0.19"]

[project.scripts]
vera-reference = "vera.cli:main"

[tool.setuptools]
packages = ["vera", "vera.templates"]

[tool.setuptools.package-data]
vera = ["templates/*.rs"]
