[package]
name = "vera-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native VERA language frontend and compiler toolchain"
repository = "https://github.com/lhemerly/vera"

[lib]
name = "vera_compiler"

[[bin]]
name = "vera"
path = "src/main.rs"

[dependencies]
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
sha2 = "0.10"
z3 = "0.21"
vera-rt = { path = "../vera-rt" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
naga = { version = "26", default-features = false, features = ["wgsl-in", "glsl-out"] }
